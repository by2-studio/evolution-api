name: Build and Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/by2-studio/evolution-api:${{ github.sha }}
            ghcr.io/by2-studio/evolution-api:latest
          cache-from: type=registry,ref=ghcr.io/by2-studio/evolution-api:latest
          cache-to: type=inline

      - name: Update Kubernetes manifest
        run: |
          sed -i "s|ghcr.io/by2-studio/evolution-api:.*|ghcr.io/by2-studio/evolution-api:${{ github.sha }}|g" k8s/overlays/prod/deployment-patch.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/deployment-patch.yaml
          git commit -m "chore: deploy ${{ github.sha }}" || exit 0
          git push
