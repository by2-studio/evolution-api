apiVersion: apps/v1
kind: Deployment
metadata:
  name: evolution-api
  labels:
    app.kubernetes.io/name: evolution-api
    app.kubernetes.io/part-of: evolution-api
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: evolution-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: evolution-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrations
          image: ghcr.io/by2-studio/evolution-api:latest
          imagePullPolicy: Always
          command: ["/bin/bash", "-c"]
          args:
            - ". ./Docker/scripts/deploy_database.sh"
          envFrom:
            - secretRef:
                name: evolution-api-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: api
          image: ghcr.io/by2-studio/evolution-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: evolution-api-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: instances
              mountPath: /evolution/instances
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: instances
          persistentVolumeClaim:
            claimName: evolution-api-instances
        - name: tmp
          emptyDir: {}
